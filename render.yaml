services:
  - type: web
    name: the-visa-gate
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:shared && npm run build:api && npm run build:web
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLOUDINARY_FOLDER
        value: thevisagate/documents
